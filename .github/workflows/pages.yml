name: Publicar Bússola da Honra
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  preparar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Validar a distribuição pública
        run: node .github/scripts/check-site.mjs
      - name: Preparar apenas os arquivos do site
        run: |
          mkdir _site
          node --input-type=module -e 'import fs from "node:fs"; import path from "node:path"; const m=JSON.parse(fs.readFileSync("PUBLICATION.json")); for(const name of m.site_files){const out=path.join("_site",name);fs.mkdirSync(path.dirname(out),{recursive:true});fs.copyFileSync(name,out);}'
      - name: Configurar Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Enviar a distribuição
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  publicar:
    needs: preparar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
